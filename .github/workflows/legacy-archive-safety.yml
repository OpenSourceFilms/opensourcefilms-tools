name: Historical archive fails closed
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "config/settings.py"
      - "scripts/setup_infrastructure.sh"
      - "scripts/setup_phase1.sh"
      - "scripts/start_services.sh"
      - "scripts/start_api.sh"
      - "tests/**"
      - ".github/workflows/legacy-archive-safety.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-archive-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verify no insecure legacy bootstrap can run accidentally
        run: python -B -m unittest discover -s tests -p 'test_legacy_archive_safety.py' -v
